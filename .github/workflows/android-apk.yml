name: Build Android Release APK

on:
  # Trigger manual dari tab "Actions" -> "Run workflow" (hemat menit runner)
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Jalankan typecheck & unit tests sebelum build Android?'
        required: false
        default: true
        type: boolean

  # Opsional: aktifkan baris di bawah jika ingin auto-build setiap push ke branch main
  # push:
  #   branches:
  #     - main

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-apk:
    name: Build arm64-v8a Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # Variabel EXPO_PUBLIC_* disisipkan saat bundling JS (createBundleReleaseJsAndAssets)
      EXPO_PUBLIC_SPOTIFY_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_SPOTIFY_CLIENT_ID }}
      EXPO_PUBLIC_SPOTIFY_REDIRECT_URI: ${{ secrets.EXPO_PUBLIC_SPOTIFY_REDIRECT_URI || 'walkthetalk://callback' }}
      EXPO_PUBLIC_CARTO_API_KEY: ${{ secrets.EXPO_PUBLIC_CARTO_API_KEY }}
      CI: true

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      # Bersihkan package bloat di VM ubuntu-latest agar tidak kehabisan disk saat download SDK 37 / NDK 27
      - name: 2. Free Runner Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      # Expo SDK 58 membutuhkan Node.js >= 22.13.x
      - name: 3. Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 4. Install Node Dependencies
        run: npm ci

      - name: 5. Run Typecheck & Unit Tests
        if: ${{ inputs.run_tests != false }}
        run: |
          npx tsc --noEmit
          npm test

      # Generate folder android/ bersih sesuai app.json + plugins lokal
      # Dijalankan SEBELUM setup-java agar cache: 'gradle' bisa menemukan gradle-wrapper.properties
      - name: 6. Expo Prebuild (Android)
        run: npx expo prebuild --platform android --clean --no-install

      # Gradle 9.4.1 (dari Expo SDK 58) membutuhkan JDK 17 atau lebih baru
      - name: 7. Setup JDK 17 & Gradle Cache
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Pasang Android commandline-tools & setujui semua lisensi SDK/NDK/CMake otomatis
      - name: 8. Setup Android SDK & Accept Licenses
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: 'true'

      # Compile APK release (arm64-v8a + R8 minify sesuai app.json)
      - name: 9. Build Release APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 10. Verify APK Output
        run: ls -lh android/app/build/outputs/apk/release/

      - name: 11. Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: walk-the-talk-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

